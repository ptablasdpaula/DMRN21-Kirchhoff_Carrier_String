[workspace]
name = "kc-string"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = "3.12.*"
pytorch = ">=2.14.1,<3"
jax = ">=0.12"
numpy = "*"
octave = ">=10.3.0,<11"
pytest = "*"
ruff = "*"

[pypi-dependencies]
kc-string = { path = ".", editable = true }

[tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."

[workspace]
authors = ["Pablo Tablas <acw794@qmul.ac.uk>"]
channels = ["conda-forge"]
name = "DMRN21-Kirchhoff_Carrier_String"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
test = "python test/kc_string.py"
ranges-check = "python test/stability_ranges.py"
forward-check = "python test/kc_string_forward.py"
workbench-check = "python test/optimization_workbench.py"
inharmonicity-check = "python test/inharmonicity_synthesis.py"
fixed-grid-check = "python test/inharmonicity_fixed_grid.py"
notebook-check = "jupyter nbconvert --execute --to notebook notebooks/kc_string.ipynb --output kc_string.executed.ipynb --output-dir .notebook-build --ExecutePreprocessor.timeout=120 --ExecutePreprocessor.kernel_name=python3"

[dependencies]
python = "3.12.*"
pytorch = ">=2.14.1,<3"
ipykernel = ">=7.4.0,<8"
nbformat = ">=5.11.1,<6"
nbconvert = ">=7.17.2,<8"
matplotlib = ">=3.10.9,<4"
ipywidgets = ">=8.1.9,<9"
ninja = ">=1.13.2,<2"

[target.osx-arm64.dependencies]
octave = ">=10.3.0,<11"

[target.linux-64.dependencies]
octave = ">=10.3.0,<11"

[pypi-dependencies]
cels-audio = { git = "https://github.com/ptablasdpaula/ICASSP27-Phrase.git", rev = "9fdbd60f5b67def8dd8884a006541e0ca4dbbf0d" }
